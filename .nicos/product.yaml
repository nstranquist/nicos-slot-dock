  - telemetry
checks:
  - name: test
    command: [make, test]
  - name: verify
    command: [make, verify]
  - name: universal
    command: [make, verify-universal]
  - name: privacy
    command: [make, privacy-check]
description: Native macOS launcher strip with custom slots, system Dock composition, running-app state, optional local permissions, and no network telemetry.
